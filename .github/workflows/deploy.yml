name: Deploy Suraksha

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/suraksha/suraksha-new

            git pull origin main

            npm install

            npm run build

            pm2 restart suraksha --update-env

            pm2 save

            sleep 5

            curl --fail --retry 5 --retry-delay 2 -I http://127.0.0.1:4545
